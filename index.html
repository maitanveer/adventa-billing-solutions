<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fffaf6" />
    <meta name="description" content="ADVENTA Billing Solutions helps healthcare providers simplify medical billing and revenue cycle workflows. Accurate Claims. Faster Reimbursements." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ADVENTA Billing Solutions" />
    <meta property="og:description" content="Medical billing support designed around your practice." />
    <meta property="og:image" content="/logo.png" />
    <script>
      (() => {
        let theme;
        try {
          theme = localStorage.getItem('adventa-theme');
        } catch {
          theme = null;
        }
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        const themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) themeColor.setAttribute('content', theme === 'dark' ? '#151615' : '#fffaf6');
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <title>ADVENTA Billing Solutions | Medical Billing &amp; RCM</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
